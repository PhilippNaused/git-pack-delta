[workspace]
resolver = "3"
members = ["apples", "delta-examples", "git-pack-delta"]
package.authors = ["Philipp Naused <philipp.naused@t-online.de>"]
package.categories = ["compression", "encoding", "parsing"]
package.description = "Pure rust implementation of Git's delta compression algorithm. (Not to be confused with it's diff algorithm!)"
package.edition = "2024"
package.keywords = ["git", "pack", "delta"]
package.license = "MIT"
package.readme = "README.md"
package.repository = "https://github.com/PhilippNaused/git-pack-delta"
package.rust-version = "1.99"
package.version = "0.0.6"

[profile.release]
debug = false
opt-level = 3
strip = true

# cspell:words codegen
[profile.bench]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
strip = true

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
# cspell:ignore cfgs
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# expect_used = "warn"
# float_arithmetic = "warn"
# missing_errors_doc = "warn"
# shadow_unrelated ="warn"
# use_debug = "warn"
alloc_instead_of_core = "warn"
big_endian_bytes = "deny"
cargo_common_metadata = "warn"
clear_with_drain = "warn"
dbg_macro = "deny"
empty_drop = "warn"
error_impl_error = "warn"
float_cmp_const = "warn"
get_unwrap = "warn"
host_endian_bytes = "allow"
inline_asm_x86_att_syntax = "warn"
large_stack_frames = "warn"
little_endian_bytes = "allow"
missing_asserts_for_indexing = "warn"
missing_const_for_fn = "warn"
non_zero_suggestions = "warn"
precedence_bits = "warn"
redundant_test_prefix = "allow"
renamed_function_params = "warn"
self_named_module_files = "warn"
std_instead_of_alloc = "allow"
std_instead_of_core = "warn"
str_to_string = "warn"
tests_outside_test_module = "deny"
todo = "warn"
too_many_lines = "warn"
use_self = "warn"
