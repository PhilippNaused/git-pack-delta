name: Rust

on:
  workflow_dispatch:
  pull_request:
    branches: main
  push:
    branches: main

env:
  CARGO_TERM_COLOR: always
  # RUSTFLAGS: -Dwarnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - ubuntu-26.04-arm
          # - windows-latest
          # - macos-latest
    runs-on: ${{ matrix.os }}
    name: Run Tests on ${{ matrix.os }}

    steps:
    - name: ⤵️ Checkout Source
      uses: actions/checkout@v7

    - name: 🦀 Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: 🔨 Build
      run: cargo build --all-targets --all-features

    - name: 🧪 Run tests
      run: cargo test --no-fail-fast --all-features

    - name: 📎 Run Clippy
      run: cargo clippy --all-targets --no-deps --all-features
